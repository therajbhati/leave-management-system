<div
  class="min-h-screen bg-gradient-to-br from-blue-600 to-blue-900 flex items-center justify-center px-4"
>
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-8 w-8 text-blue-600"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"
          />
        </svg>
      </div>
      <h2 class="text-3xl font-bold text-gray-800">Forgot Password</h2>
      <p class="text-gray-500 mt-1 text-sm">Enter your email to receive a reset code</p>
    </div>

    <!-- Success Message -->
    <div
      *ngIf="successMessage"
      class="bg-green-50 text-green-700 text-sm px-4 py-3 rounded-lg mb-4 border border-green-200"
    >
      {{ successMessage }}
      <div class="mt-3 text-center">
        <button
          (click)="goToReset()"
          class="text-blue-600 hover:underline font-medium text-sm bg-transparent border-none cursor-pointer"
        >
          → Enter your reset code here
        </button>
      </div>
    </div>

    <!-- Error Message -->
    <div
      *ngIf="errorMessage"
      class="bg-red-50 text-red-600 text-sm px-4 py-3 rounded-lg mb-4 border border-red-200"
    >
      {{ errorMessage }}
    </div>

    <!-- Form -->
    <form
      [formGroup]="forgotForm"
      (ngSubmit)="onSubmit()"
      class="space-y-5"
      *ngIf="!successMessage"
    >
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
          [ngClass]="{ 'border-red-400': email?.invalid && email?.touched }"
        />
        <p *ngIf="email?.invalid && email?.touched" class="text-red-500 text-xs mt-1">
          Please enter a valid email
        </p>
      </div>

      <button
        type="submit"
        [disabled]="forgotForm.invalid || isLoading"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span *ngIf="!isLoading">Send Reset Code</span>
        <span *ngIf="isLoading">Sending...</span>
      </button>
    </form>

    <!-- Back to Login -->
    <p class="text-center text-sm text-gray-500 mt-6">
      Remember your password?
      <button
        type="button"
        (click)="goToLogin()"
        class="text-blue-600 hover:underline font-medium bg-transparent border-none cursor-pointer"
      >
        Back to Login
      </button>
    </p>

    <p class="text-center text-xs text-gray-400 mt-6">Leave Management System &copy; 2026</p>
  </div>
</div>
